<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NORTE — Tu Guía Financiera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <style>
    :root {
      --bg-outer: #E0F2FE;
      --bg-app: #F4FAFF;
      --card-bg: #FFFFFF;
      --border: #BAE6FD;
      --border-soft: #E0F2FE;
      --sky-primary: #38BDF8;
      --sky-bright: #7DD3FC;
      --sky-soft: #E0F2FE;
      --sky-ultra-soft: #F0F9FF;
      --sky-accent: #0EA5E9;
      --navy: #0F172A;
      --slate: #475569;
      --slate-light: #64748B;
      --emerald: #10B981;
      --emerald-soft: #ECFDF5;
      --amber: #F59E0B;
      --amber-soft: #FFFBEB;
      --rose: #F43F5E;
      --rose-soft: #FFF1F2;
      --shadow-sm: 0 4px 12px rgba(56, 189, 248, 0.08);
      --shadow-md: 0 10px 28px rgba(14, 165, 233, 0.12);
      --shadow-lg: 0 20px 44px rgba(14, 165, 233, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #E0F2FE 0%, #F0F9FF 100%);
      color: var(--navy);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100dvh;
      line-height: 1.45;
      transition: background 0.3s ease;
    }

    /* =========================================================================
       CONTENEDOR PRINCIPAL + MODO MÓVIL / MODO ORDENADOR
       ========================================================================= */
    #app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 0;
      background-color: var(--bg-app);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(14, 165, 233, 0.16);
      overflow-x: hidden;
      transition: max-width 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.35s ease, margin 0.35s ease;
    }

    body.desktop-mode #app-shell {
      max-width: 960px;
      min-height: 0;
      margin: 16px auto;
      border-radius: 28px;
      border: 1.5px solid var(--border);
    }

    /* =========================================================================
       SELECTOR FLOTANTE ARRIBA A LA DERECHA (MÓVIL / ORDENADOR)
       ========================================================================= */
    .viewport-switcher {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 90;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      box-shadow: var(--shadow-sm);
    }

    .vp-btn {
      border: none;
      background: transparent;
      color: var(--slate);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.18s ease;
    }

    .vp-btn:hover {
      color: var(--sky-accent);
    }

    .vp-btn.active {
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(14, 165, 233, 0.25);
    }

    /* =========================================================================
       PANTALLA DE BIENVENIDA (HOME SCREEN)
       ========================================================================= */
    .welcome-screen {
      padding: 38px 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 12px;
      background: linear-gradient(180deg, #E0F2FE 0%, #F4FAFF 45%, #FFFFFF 100%);
      animation: screenEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.desktop-mode .welcome-screen {
      padding: 36px 38px 26px;
      gap: 16px;
    }

    .welcome-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    /* Marco del logo encuadrado exactamente igual que la imagen horizontal */
    .welcome-logo-wrap {
      width: 196px;
      aspect-ratio: 16 / 9;
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .welcome-logo-fallback {
      width: 100%;
      height: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 0.08em;
    }

    .welcome-desc {
      font-size: 13.5px;
      color: var(--slate);
      max-width: 460px;
      line-height: 1.5;
    }

    .welcome-selector-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .selector-label {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--sky-accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-wrapper {
      position: relative;
      width: 100%;
    }

    .profile-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: #FFFFFF;
      border: 2px solid var(--sky-primary);
      border-radius: 16px;
      padding: 14px 44px 14px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .profile-select:focus {
      outline: none;
      border-color: var(--sky-accent);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.22);
    }

    .select-chevron {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--sky-accent);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    /* Viñeta dinámica con marco 16:9 exacto para las fotos de families/*.jpg */
    .welcome-vignette {
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: vignettePop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.desktop-mode .welcome-vignette {
      display: grid;
      grid-template-columns: 270px 1fr;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    @keyframes vignettePop {
      from { opacity: 0.4; transform: translateY(6px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Marco fotográfico exactamente 16:9 como las imágenes JPG */
    .family-photo-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .family-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
    }

    .family-photo-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
    }

    .vignette-details {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .vignette-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--sky-ultra-soft);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }

    .vignette-quest {
      background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
      border-radius: 14px;
      padding: 11px 13px;
      font-size: 12.5px;
      color: var(--navy);
      line-height: 1.45;
      border-left: 4px solid var(--sky-accent);
    }

    /* =========================================================================
       TOPBAR DEL MAPA
       ========================================================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border);
      padding: 36px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    body.desktop-mode .topbar {
      padding: 16px 28px 14px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    body.desktop-mode .topbar-row {
      padding-right: 165px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Marco del logo en la barra superior exactamente 16:9 */
    .brand-logo-frame {
      width: 96px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .brand-fallback {
      width: 100%;
      height: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    .expedition-switch-btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      color: var(--sky-accent);
      background: var(--sky-ultra-soft);
      border: 1.5px solid var(--border);
      padding: 5px 10px 5px 5px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .expedition-switch-btn:hover {
      background: var(--sky-soft);
      border-color: var(--sky-primary);
    }

    /* Miniatura 16:9 exacta en el botón de perfil de la cabecera */
    .header-thumb-16x9 {
      width: 38px;
      aspect-ratio: 16 / 9;
      border-radius: 999px;
      overflow: hidden;
      border: 1.5px solid var(--sky-primary);
      flex-shrink: 0;
      background: var(--sky-soft);
    }

    .header-thumb-16x9 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    /* MAPA DE MONTAÑA SVG */
    .mountain-map-box {
      background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 75%, #FFFFFF 100%);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 5px 8px 4px;
      position: relative;
      overflow: hidden;
    }

    .mountain-svg {
      width: 100%;
      height: 66px;
      display: block;
      overflow: visible;
    }

    .trail-path-bg {
      fill: none;
      stroke: #BAE6FD;
      stroke-width: 3;
      stroke-dasharray: 5 5;
      stroke-linecap: round;
    }

    .trail-path-active {
      fill: none;
      stroke: var(--sky-accent);
      stroke-width: 3.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .camp-node { transition: all 0.4s ease; }

    .camp-label {
      font-size: 9px;
      font-weight: 800;
      fill: var(--slate);
      text-anchor: middle;
    }

    .camp-label.active { fill: var(--sky-accent); }
    .camp-label.done { fill: var(--emerald); }

    #michael-hiker {
      transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .hiker-bob {
      animation: hikerBob 1.8s ease-in-out infinite;
    }

    @keyframes hikerBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    /* Floating Stat Delta Toast */
    .delta-float {
      position: fixed;
      top: 162px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: var(--sky-accent);
      color: #FFFFFF;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-lg);
      z-index: 60;
      pointer-events: none;
      animation: floatUpFade 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.92); }
      18% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      80% { opacity: 1; transform: translateX(-50%) translateY(-6px) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-18px) scale(0.96); }
    }

    /* Main Screen Container */
    .screen {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 11px;
      animation: screenEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.desktop-mode .screen {
      padding: 18px 34px 20px;
      gap: 14px;
    }

    .screen-body {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    @keyframes screenEnter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* DOCK INFERIOR DE INDICADORES */
    .indicators-dock {
      background: #FFFFFF;
      border-top: 1.5px solid var(--border);
      padding: 9px 12px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 -6px 20px rgba(14, 165, 233, 0.06);
    }

    body.desktop-mode .indicators-dock {
      padding: 14px 28px 18px;
    }

    .indicators-dock-title {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--sky-accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .indicators-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    body.desktop-mode .indicators-grid {
      gap: 14px;
    }

    .indicator-card {
      background: var(--sky-ultra-soft);
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      padding: 9px 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .indicator-card.bump {
      transform: scale(1.05);
      background: var(--sky-soft);
      border-color: var(--sky-primary);
    }

    .ind-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--navy);
    }

    .ind-name {
      font-size: 11px;
      font-weight: 800;
      color: var(--sky-accent);
      line-height: 1.2;
    }

    .ind-desc {
      font-size: 10px;
      color: var(--slate);
      line-height: 1.28;
    }

    .ind-bar-bg {
      height: 5px;
      background: #DBEAFE;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 2px;
    }

    .ind-bar-fill {
      height: 100%;
      background: var(--sky-accent);
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    /* NORA DIALOGUE */
    .nora-dialogue {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 10px 12px;
      display: flex;
      gap: 11px;
      align-items: center;
      box-shadow: var(--shadow-md);
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .nora-dialogue.happy {
      background: linear-gradient(135deg, #E0F2FE 0%, #FFFFFF 100%);
      border-color: var(--sky-primary);
    }

    .nora-avatar-box {
      width: 124px;
      aspect-ratio: 16 / 10;
      border-radius: 14px;
      background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 100%);
      border: 2px solid var(--sky-bright);
      padding: 0;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      animation: noraBreathe 3.2s ease-in-out infinite;
    }

    @keyframes noraBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .nora-avatar-box.bounce {
      animation: noraPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes noraPop {
      0% { transform: scale(0.9); }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .nora-avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .nora-speaker {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sky-accent);
      margin-bottom: 4px;
    }

    .nora-speech {
      font-size: 13px;
      color: var(--navy);
      font-weight: 500;
      line-height: 1.42;
      min-height: 36px;
    }

    .typing-cursor::after {
      content: "▋";
      color: var(--sky-primary);
      animation: blinkCursor 0.7s infinite;
      margin-left: 2px;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Typography & Cards */
    .eyebrow {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--sky-accent);
    }

    h1 {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    h2 {
      font-size: 18.5px;
      font-weight: 800;
      line-height: 1.28;
      letter-spacing: -0.015em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--slate);
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 15px;
      box-shadow: var(--shadow-sm);
    }

    /* Character Sheet Card con retrato 16:9 exacto en Campamento Base */
    .char-sheet {
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
      color: #FFFFFF;
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.desktop-mode .char-sheet {
      display: grid;
      grid-template-columns: 260px 1fr;
      align-items: center;
      gap: 18px;
      padding: 18px;
    }

    .char-photo-16x9 {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
      background: rgba(255, 255, 255, 0.15);
    }

    .char-photo-16x9 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
    }

    .char-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .char-class {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .char-stats-mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.18);
      padding: 10px;
      border-radius: 14px;
      text-align: center;
    }

    /* CARTA FÍSICA 3D VOLTEABLE */
    .reigns-scene {
      perspective: 1100px;
      width: 100%;
    }

    .reigns-card {
      width: 100%;
      display: grid;
      transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.34, 1.36, 0.64, 1);
    }

    .reigns-card.flipped {
      transform: rotateY(180deg);
    }

    .reigns-face {
      grid-area: 1 / 1;
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 14px 14px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reigns-front {
      background: linear-gradient(180deg, #F0F9FF 0%, #FFFFFF 36%);
    }

    .reigns-back {
      transform: rotateY(180deg);
      justify-content: space-between;
      text-align: center;
      background: linear-gradient(180deg, #E0F2FE 0%, #FFFFFF 45%);
      border-color: var(--sky-primary);
    }

    .reigns-back.blocked-back {
      background: linear-gradient(180deg, #FFFBEB 0%, #FFFFFF 45%);
      border-color: var(--amber);
    }

    .reigns-emblem {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      margin: 0 auto;
      background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
      border: 2px solid #FFFFFF;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sky-accent);
    }

    .reigns-choices {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 2px;
    }

    body.desktop-mode .reigns-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .swipe-btn {
      width: 100%;
      background: var(--sky-ultra-soft);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .swipe-btn:hover {
      border-color: var(--sky-primary);
      background: var(--sky-soft);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .swipe-dir-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sky-accent);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .swipe-btn.warn-choice .swipe-dir-badge {
      color: var(--amber);
    }

    /* Option buttons */
    .option-btn {
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 13px 15px;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .option-btn:hover {
      border-color: var(--sky-primary);
      background: var(--sky-ultra-soft);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .option-btn.selected {
      border-color: var(--sky-accent);
      background: var(--sky-soft);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .option-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      display: block;
    }

    .option-desc {
      font-size: 12px;
      color: var(--slate);
      display: block;
      margin-top: 2px;
    }

    .stat-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .stat-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .tag-pos { background: var(--emerald-soft); color: var(--emerald); }
    .tag-neg { background: var(--rose-soft); color: var(--rose); }
    .tag-warn { background: var(--amber-soft); color: var(--amber); }

    /* Pills & Bars */
    .pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .pill-sky { background: var(--sky-soft); color: var(--sky-accent); }
    .pill-navy { background: #F1F5F9; color: var(--slate); }
    .pill-green { background: var(--emerald-soft); color: var(--emerald); }
    .pill-amber { background: var(--amber-soft); color: var(--amber); }

    .bar-item-head {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .bar-track {
      height: 9px;
      background: var(--sky-soft);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--sky-primary);
      width: 0%;
      transition: width 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bar-fill.accent { background: var(--sky-accent); }

    /* Strengths / Buffs */
    .buff-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .buff-row:last-child { border-bottom: none; padding-bottom: 0; }

    .buff-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--sky-soft);
      color: var(--sky-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.28);
    }

    .btn-primary:hover {
      filter: brightness(1.04);
      transform: translateY(-2px);
    }

    .btn-secondary {
      width: 100%;
      background: var(--sky-soft);
      color: var(--sky-accent);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 13px 16px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .btn-secondary:hover { background: #BAE6FD; }

    .btn-amber {
      width: 100%;
      background: var(--amber);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      padding: 13px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.28);
    }

    /* Two Futures Grid */
    .futures-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    body.desktop-mode .futures-grid {
      gap: 16px;
    }

    .future-col {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 18px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .future-col.highlight {
      border-color: var(--sky-primary);
      background: linear-gradient(180deg, #E0F2FE 0%, #FFFFFF 100%);
    }

    .sim-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sim-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--sky-primary);
      color: var(--sky-accent);
      border-radius: 14px;
      padding: 11px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .sim-btn.active {
      background: var(--sky-accent);
      color: #FFFFFF;
    }

    /* Reverso de la carta: Nora */
    .back-nora-badge {
      width: 176px;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      margin: 0 auto;
      background: #E0F2FE;
      border: 2px solid var(--sky-primary);
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
    }

    .reigns-back.blocked-back .back-nora-badge {
      background: var(--amber-soft);
      border-color: var(--amber);
    }

    .back-nora-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    function getCurrentMountainNode() {
      if (["welcome", "intro", "concern", "buffs"].includes(game.step)) return 0;
      if (game.step === "stage") return Math.min(3, game.stageIndex + 1);
      if (game.step === "event") return 3;
      return 4;
    }

    function updateMountainMap() {
      const currentNode = getCurrentMountainNode();
      const nodesGroup = document.getElementById("mountain-nodes");
      const hiker = document.getElementById("michael-hiker");
      const trailActive = document.getElementById("trail-active");
      const trailBg = document.getElementById("trail-bg");

      if (!nodesGroup || !hiker) return;

      if (trailActive && trailBg && trailBg.getTotalLength) {
        const totalLen = trailBg.getTotalLength();
        trailActive.style.strokeDasharray = totalLen;
        const pct = currentNode / (MOUNTAIN_CAMPS.length - 1);
        trailActive.style.strokeDashoffset = totalLen * (1 - pct);
      }

      nodesGroup.innerHTML = MOUNTAIN_CAMPS.map(camp => {
        const isDone = camp.id < currentNode;
        const isCurrent = camp.id === currentNode;

        let circleFill = "#FFFFFF";
        let strokeColor = "#BAE6FD";
        let iconChar = "🔒";

        if (isDone) {
          circleFill = "#10B981";
          strokeColor = "#A7F3D0";
          iconChar = "✓";
        } else if (isCurrent) {
          circleFill = "#38BDF8";
          strokeColor = "#0EA5E9";
          iconChar = camp.id === 4 ? "🚩" : "★";
        } else if (camp.id === 4) {
          iconChar = "🚩";
        }

        const labelClass = isDone ? "camp-label done" : (isCurrent ? "camp-label active" : "camp-label");

        return `
          <g class="camp-node" transform="translate(${camp.x}, ${camp.y})">
            <circle cx="0" cy="0" r="${isCurrent ? 10 : 8.5}" fill="${circleFill}" stroke="${strokeColor}" stroke-width="2" />
            <text x="0" y="3" text-anchor="middle" font-size="8.5" font-weight="800" fill="${isDone || isCurrent ? '#FFFFFF' : '#64748B'}">${iconChar}</text>
            <text x="0" y="16" class="${labelClass}">${camp.label}</text>
          </g>
        `;
      }).join("");

      const targetCamp = MOUNTAIN_CAMPS[currentNode] || MOUNTAIN_CAMPS[0];
      hiker.setAttribute("transform", `translate(${targetCamp.x}, ${targetCamp.y - 2})`);
    }

    function clamp(val) {
      return Math.max(10, Math.min(100, val));
    }

    function applyStatDelta(delta) {
      if (!delta) return;
      game.stats.shield = clamp(game.stats.shield + (delta.shield || 0));
      game.stats.energy = clamp(game.stats.energy + (delta.energy || 0));
      game.stats.compass = clamp(game.stats.compass + (delta.compass || 0));

      updateHUD(true);
      showFloatingToast(delta);
    }

        headerPhoto.alt = m.name;

      const mapping = [
        { key: "shield", valId: "val-shield", cardId: "card-shield", barId: "bar-shield" },
        { key: "energy", valId: "val-energy", cardId: "card-energy", barId: "bar-energy" },
        { key: "compass", valId: "val-compass", cardId: "card-compass", barId: "bar-compass" }
      ];

      mapping.forEach(item => {
        const valEl = document.getElementById(item.valId);
        const cardEl = document.getElementById(item.cardId);
        const barEl = document.getElementById(item.barId);
        if (valEl && cardEl) {
          valEl.textContent = game.stats[item.key];
          if (barEl) barEl.style.width = game.stats[item.key] + "%";
          if (animateBump) {
            cardEl.classList.remove("bump");
            void cardEl.offsetWidth;
            cardEl.classList.add("bump");
          }
        }
      });

      updateMountainMap();
    }

    function showFloatingToast(delta) {
      const parts = [];
      if (delta.shield) parts.push(`🛡️ Colchón ${delta.shield > 0 ? '+' : ''}${delta.shield}`);
      if (delta.energy) parts.push(`⚡ Holgura ${delta.energy > 0 ? '+' : ''}${delta.energy}`);
      if (delta.compass) parts.push(`🧭 Rumbo ${delta.compass > 0 ? '+' : ''}${delta.compass}`);
      if (parts.length === 0) return;

      const toast = document.createElement("div");
      toast.className = "delta-float";
      toast.innerHTML = parts.join(" &nbsp;·&nbsp; ");
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    function renderNoraDialogue(fullText, spriteKey = "inicio", happyStyle = false, speakerLabel = NORA_ROLE_LABEL) {
      const imgPath = NORA_SPRITES[spriteKey] || NORA_SPRITES.inicio;
      return `
        <div class="nora-dialogue ${happyStyle ? 'happy' : ''}">
          <div class="nora-avatar-box bounce">
            <img src="${imgPath}" alt="NORA" />
          </div>
          <div style="flex:1;">
            <div class="nora-speaker">
              <i data-lucide="compass" style="width:13px;height:13px;"></i>
              <span>${speakerLabel}</span>
            </div>
            <p class="nora-speech typing-cursor" id="nora-type-target" data-fulltext="${fullText.replace(/"/g, '&quot;')}"></p>
          </div>
        </div>
      `;
    }

    function startTypewriter() {
      if (typingTimer) clearInterval(typingTimer);
      const el = document.getElementById("nora-type-target");
      if (!el) return;
      const text = el.getAttribute("data-fulltext") || "";
      el.textContent = "";
      let idx = 0;
      typingTimer = setInterval(() => {
        el.textContent += text.charAt(idx);
        idx++;
        if (idx >= text.length) {
          clearInterval(typingTimer);
          el.classList.remove("typing-cursor");
        }
      }, 14);
    }

    function animateBars() {
      requestAnimationFrame(() => {
        document.querySelectorAll(".bar-fill[data-target]").forEach(el => {
          el.style.width = el.getAttribute("data-target") + "%";
        });
      });
    }

    /**
     * =========================================================================
     * ACCIONES DE CARTA 3D
     * =========================================================================
     */
    function selectConcern(concernId) {
      const m = getActiveCase();
      const con = m.concerns.find(c => c.id === concernId);
      game.selectedConcern = con;
      game.selectedActionIndex = 0;
      applyStatDelta(con.delta);
      game.step = "buffs";
      render();
    }

    function flipStageCard(stageKey, optionIdx) {
      const m = getActiveCase();
      const st = m.stages[stageKey];
      const opt = st.options[optionIdx];
      game.lastCardOutcome = opt;
      game.cardFlipped = true;

      if (opt.simulated && opt.delta) {
        applyStatDelta(opt.delta);
      }
      render();
    }

    function unflipBlockedCard() {
      game.cardFlipped = false;
      game.lastCardOutcome = null;
      render();
    }

    function advanceAfterCard(isLast) {
      game.cardFlipped = false;
      game.lastCardOutcome = null;
      if (isLast) {
        game.step = "event";
      } else {
        game.stageIndex++;
      }
      render();
    }

    function flipEventCard() {
      game.cardFlipped = true;
      render();
    }

    function confirmFirstStep() {
      applyStatDelta({ shield: 5, energy: 5, compass: 5 });
      game.simDay = 0;
      game.step = "mission";
      render();
    }

    function restartGame() {
      startExpeditionFromWelcome();
    }

    // Iniciar en la Pantalla de Bienvenida con Michael Carter seleccionado por defecto
    render();
  </script>
</body>
